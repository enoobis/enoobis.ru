<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="закрытая платформа с блогами, курсами и сообществом. вход по приглашению."
    />
    <link rel="canonical" href="https://enoobis.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="enoobis" />
    <meta property="og:title" content="enoobis — закрытая платформа с блогами, курсами и сообществом" />
    <meta
      property="og:description"
      content="закрытая платформа с блогами, курсами и сообществом. вход по приглашению."
    />
    <meta property="og:url" content="https://enoobis.ru/" />
    <meta property="og:image" content="https://enoobis.ru/logo-mark.png" />
    <title>enoobis — закрытая платформа с блогами, курсами и сообществом</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("enoobis_viewer_prefs");
          if (!raw) return;
          var p = JSON.parse(raw);
          var t = p.theme_preference || "black";
          if (t !== "white" && t !== "contrast" && t !== "contrast-white") t = "black";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme =
            t === "white" || t === "contrast-white" ? "light" : "dark";
          var scale =
            p.font_preference === "compact" ? "0.94" : p.font_preference === "large" ? "1.08" : "1";
          document.documentElement.style.setProperty("--app-font-scale", scale);
          if (p.language_preference) document.documentElement.lang = p.language_preference;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon-round.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
